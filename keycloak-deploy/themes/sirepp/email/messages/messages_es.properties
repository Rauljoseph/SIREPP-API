passwordResetSubject=Recuperación de contraseña de SIREPP
passwordResetBody=Se recibió una solicitud para recuperar la contraseña de su cuenta de SIREPP.\n\nPara continuar, abra el siguiente enlace y confirme su identidad con el código de su aplicación autenticadora:\n{0}\n\nEste enlace vence en {3} y es de un solo uso. Si usted no solicitó la recuperación, puede ignorar este mensaje.\n\nEquipo SIREPP
passwordResetBodyHtml=<p>Se recibió una solicitud para recuperar la contraseña de su cuenta de SIREPP.</p><p>Para continuar, seleccione <a href="{0}">Recuperar contraseña</a> y confirme su identidad con el código de su aplicación autenticadora.</p><p>Este enlace vence en {3} y es de un solo uso. Si usted no solicitó la recuperación, puede ignorar este mensaje.</p><p>Equipo SIREPP</p>
eventUserDisabledByTemporaryLockoutSubject=Alerta de seguridad de SIREPP
eventUserDisabledByTemporaryLockoutBody=Bloqueamos temporalmente el inicio de sesión de su cuenta de SIREPP tras varios intentos fallidos.\n\nSi reconoce los intentos, espere a que termine el bloqueo antes de volver a iniciar sesión. Si olvidó su contraseña o no reconoce los intentos, entre al sitio habitual de SIREPP y seleccione Recuperar contraseña. Si necesita ayuda, contacte al administrador.\n\nEquipo SIREPP
eventUserDisabledByTemporaryLockoutHtml=<p>Bloqueamos temporalmente el inicio de sesión de su cuenta de SIREPP tras varios intentos fallidos.</p><p>Si reconoce los intentos, espere a que termine el bloqueo antes de volver a iniciar sesión. Si olvidó su contraseña o no reconoce los intentos, entre al sitio habitual de SIREPP y seleccione <strong>Recuperar contraseña</strong>. Si necesita ayuda, contacte al administrador.</p><p>Equipo SIREPP</p>
